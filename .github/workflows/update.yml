name: Update earnings data

on:
  schedule:
    - cron: '10 * * * *' # 매시 10분 (KST 기준 시간별 갱신)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch latest earnings data
        run: node update-data.mjs
      - name: Commit & push if changed
        run: |
          if git diff --quiet -- earnings.json; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add earnings.json
          git commit -m "data: earnings auto-update ($(date -u +%Y-%m-%dT%H:%M))"
          git push
